# 后端部署：推送代码到服务器并重启 Docker
# 前置条件：服务器需手动创建 .env.production（含 DATABASE_PASSWORD、JWT_SECRET 等）
# Secrets：在仓库 Settings → Secrets 中配置 SERVER_PASSWORD
name: 后端构建并部署到服务器

on:
  push:
    branches:
      - main
      - master
      - test
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

concurrency:
  group: "deploy-backend"
  cancel-in-progress: false

env:
  SERVER_HOST: "139.224.68.145"
  # main/master -> 生产目录；test -> 测试目录（用于 rsync 代码 + 执行 start.sh）
  DEPLOY_PATH_PROD: "/root/gallery/production/chong_backend"
  DEPLOY_PATH_TEST: "/root/gallery/test/chong_backend"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 sshpass 和 rsync
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: 同步代码到服务器并部署
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          export SSHPASS="$SERVER_PASSWORD"
          BR="${{ github.ref_name }}"
          if [ "$BR" = "test" ]; then
            DEST="${{ env.DEPLOY_PATH_TEST }}"
            START_CMD="bash ./start.sh test"
          else
            DEST="${{ env.DEPLOY_PATH_PROD }}"
            START_CMD="bash ./start.sh production"
          fi
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'logs' \
            --exclude '.env*' \
            --exclude '*.log' \
            ./ root@${{ env.SERVER_HOST }}:"$DEST"/
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} \
            "cd \"$DEST\" && chmod +x deploy/prod/start.sh deploy/test/start.sh start.sh stop.sh 2>/dev/null; $START_CMD"
