services:
  nginx:
    build:
      context: ../nginx
      args:
        NGINX_SITE: prod
    volumes:
      - ../nginx/html/dist:/usr/share/nginx/html:ro
      - ../nginx/ssl:/etc/ssl/cert:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    networks:
      - default

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose:
      - "4000"
    ports:
      - "4000:4000"
    env_file:
      - ../.env.prod
    volumes:
      - /var/log/galleryrepo:/var/log/galleryrepo:rw
    networks:
      - mac_docker_network
      - default

  # redis:
