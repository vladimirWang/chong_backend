services:
  nginx:
    build:
      context: ../nginx
      args:
        NGINX_SITE: prod
    # 服务器重启后 nginx 可能早于 server 接入网络，静态 upstream 解析失败会 emerg 退出；
    # 加自重启 + 等 server 健康后再启动
    restart: unless-stopped
    volumes:
      - ../nginx/html/dist:/usr/share/nginx/html:ro
      - ../nginx/ssl:/etc/ssl/cert:ro
      # 用户上传文件（商品图、租户 logo）：与 server 共享同一宿主机目录，由 nginx 直接托管
      - /var/lib/galleryrepo/uploads:/usr/share/nginx/uploads:ro
    ports:
      - "6080:80"
      - "6443:443"
    depends_on:
      server:
        condition: service_healthy
    # 2C2G 机器：单容器内存封顶 + 日志轮转，避免整机夯死/磁盘被日志撑爆
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - default

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 固定镜像名，worker 复用同一镜像，避免重复构建
    image: repo-backend:latest
    # migrate 遇到 mysql 未就绪等瞬时故障时自动重试，避免容器永久退出
    restart: unless-stopped
    # Bun 运行时峰值（prisma/redis 连接池）；超过只杀本容器自动重启，不拖垮整机
    mem_limit: 320m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    expose:
      - "4000"
    ports:
      - "4000:4000"
    env_file:
      - ../.env.prod
    # depends_on:
    #   image-service:
    #     condition: service_healthy
    volumes:
      - /var/log/galleryrepo_server:/var/log/galleryrepo_server:rw
      # 上传文件持久化（商品图、租户 logo），否则容器重建后图片丢失/404
      - /var/lib/galleryrepo/uploads:/app/public/uploads:rw
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "fetch('http://127.0.0.1:4000/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - mac_docker_network
      - default

  # image-service:
  #   build:
  #     context: /root/image_service
  #     dockerfile: Dockerfile
  #   image: image-service:latest
  #   restart: unless-stopped
  #   expose:
  #     - "50051"
  #   environment:
  #     IMAGE_GRPC_HOST: 0.0.0.0
  #     IMAGE_GRPC_PORT: 50051
  #   networks:
  #     - mac_docker_network

  # RabbitMQ 消费者：与 server 共用同一镜像，仅覆盖启动命令
  worker:
    image: repo-backend:latest
    command: bun run src/worker.ts
    env_file:
      - ../.env.prod
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 200m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - /var/log/galleryrepo_worker:/var/log/galleryrepo_worker:rw
    networks:
      - mac_docker_network
      - default

  # redis:
  #   image: redis:7.0-alpine
  #   ports:
  #     - "6379:6379"
  #   command:
  #     ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
  #   volumes:
  #     - redis_data_prod:/data

# volumes:
