# 生产目录栈：MySQL + Redis + Nginx(80/443) + 生产后端 :3000
# 与测试栈通过固定网络名 gallery_internal 互通（测试目录仅起 3001 后端）
# 在仓库根目录执行: ./deploy/prod/start.sh
name: fullstack-prod

networks:
  gallery_net:
    name: gallery_internal
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: fullstack-mysql
    # restart: unless-stopped  # 排查崩溃循环时暂时关闭自动重启
    networks:
      - gallery_net
    environment:
      MYSQL_ROOT_PASSWORD: "${DATABASE_PASSWORD}"
      MYSQL_DATABASE: gallery
      # 允许从 Docker 网段（如 172.x）用 root 连接；仅空数据目录首次初始化时生效
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../mysql/init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DATABASE_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fullstack-redis
    # restart: unless-stopped  # 排查崩溃循环时暂时关闭自动重启
    networks:
      - gallery_net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bun-backend-prod:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: fullstack-bun-prod
    # restart: unless-stopped  # 排查崩溃循环时暂时关闭自动重启
    networks:
      - gallery_net
    ports:
      - "3000:3000"
    env_file:
      - ../../.env.production
    volumes:
      - "${HOST_LOG_DIR:-/var/log/galleryrepo}:${LOG_DIR:-/var/log/galleryrepo}"
      - ../../public:/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ../..
      dockerfile: nginx/Dockerfile
    container_name: fullstack-nginx
    # restart: unless-stopped  # 排查崩溃循环时暂时关闭自动重启
    networks:
      - gallery_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - "${FRONTEND_DIST_PROD:-/root/gallery/production/frontend-dist}:/usr/share/nginx/html-prod:ro"
      - "/etc/ssl/cert:/etc/ssl/cert:ro"
    depends_on:
      - bun-backend-prod

volumes:
  mysql_data:
  redis_data:
