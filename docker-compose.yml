# Docker Compose 配置 - Bun + Golang 服务
# 适用 Docker 28.x
# 从 repo_backend 目录运行
name: fullstack

services:
  mysql:
    image: mysql:8.0
    container_name: fullstack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: gallary_development
    ports:
      - "3307:3306"  # 主机 3307，避免与本地 MySQL(3306) 冲突
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fullstack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  golang-backend:
    build:
      context: ../chong_backend_golang
      dockerfile: Dockerfile
    container_name: fullstack-golang
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      PORT: "8888"
      SERVER_ADDR: ":8888"
      PUBLIC_BASE_URL: "http://localhost:8888"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      MYSQL_DSN: "root:123456@tcp(mysql:3306)/gallary_development?charset=utf8mb4&parseTime=True&loc=Local"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  bun-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fullstack-bun
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      LOG_DIR: "${LOG_DIR:-/var/log/galleryrepo}"
      DATABASE_URL: "mysql://root:123456@mysql:3306/gallary_development"
      DATABASE_HOST: "mysql"
      DATABASE_NAME: "gallary_development"
      DATABASE_USER: "root"
      DATABASE_PASSWORD: "123456"
      DATABASE_PORT: "3306"
      JWT_SECRET: "Fischl von Luftschloss Narfidort"
      REDIS_URL: "redis://redis:6379"
      GO_SERVER_ADDRESS: "http://golang-backend:8888"
    volumes:
      # 宿主机 HOST_LOG_DIR -> 容器内 LOG_DIR，可通过环境变量覆盖
      - "${HOST_LOG_DIR:-/var/log/galleryrepo}:${LOG_DIR:-/var/log/galleryrepo}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
