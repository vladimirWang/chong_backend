# main 分支 / 生产：www.hetou.vip、根域名 hetou.vip
# SSL：ssl/wms.hetou.vip.pem、www.hetou.vip.key

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://server:4000/;
    }

    location /nodejs_api/ {
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://server:4000;
    }

    # 用户上传文件：nginx 直接读挂载目录返回，不经过 Bun
    # 注意用 alias：/uploads/a.jpg → /usr/share/nginx/uploads/a.jpg（用 root 会多拼一层）
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Vite 构建产物：文件名带内容 hash，内容变更时文件名必然变化，
    # 可放心长期强缓存，二次刷新直接命中浏览器缓存、零传输
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wms.hetou.vip hetou.vip;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/ssl/cert/wms.hetou.vip.pem;
    ssl_certificate_key /etc/ssl/cert/wms.hetou.vip.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://server:4000/;
    }

    location /nodejs_api/ {
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://server:4000;
    }

    # 用户上传文件：nginx 直接读挂载目录返回，不经过 Bun
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Vite 构建产物：文件名带内容 hash，内容变更时文件名必然变化，
    # 可放心长期强缓存，二次刷新直接命中浏览器缓存、零传输
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 139.224.68.145;

    ssl_certificate     /etc/ssl/cert/wms.hetou.vip.pem;
    ssl_certificate_key /etc/ssl/cert/wms.hetou.vip.key;

    return 301 https://wms.hetou.vip$request_uri;
}
