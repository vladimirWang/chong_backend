# 本项目生产站点：wms.hetou.vip（WMS 系统）
# 宿主端口映射：6080:80、6443:443（见 docker-compose.yml nginx 服务）
# www.hetou.vip / hetou.vip 由另一个项目（landing）的 nginx 容器负责

# ---------- HTTP(宿主 6080) 统一 301 到 HTTPS(宿主 6443)，非标准端口必须显式带上 ----------
server {
    listen 80 default_server;
    server_name _;
    return 301 https://wms.hetou.vip:6443$request_uri;
}

# ---------- 443 兜底：未配置域名直接拒绝握手 ----------
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ---------- WMS 站点：wms.hetou.vip ----------
server {
    listen 443 ssl;
    http2 on;
    server_name wms.hetou.vip;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/ssl/cert/wms.hetou.vip.pem;
    ssl_certificate_key /etc/ssl/cert/wms.hetou.vip.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://server:4000/;
    }

    location /nodejs_api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://server:4000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
