worker_processes auto;
events { }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 开启实时 gzip 压缩：前端 vendor 包（antd/charts 等）明文 JS 有 3MB+，
    # 压缩后通常只有原来的 1/3 左右，显著缩短刷新时的下载时间。
    # 带内容 hash 的 /assets/ 资源被浏览器长缓存，只需压缩首次请求，CPU 开销可控。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/wasm;

    # 由构建参数选择：prod → www.hetou.vip；test → test.hetou.vip
    include /etc/nginx/conf.d/site.conf;
}
